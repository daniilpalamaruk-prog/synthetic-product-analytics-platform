[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-saas-analytics"
version = "1.0.0"
description = "Production-like synthetic B2C SaaS dataset generator"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyarrow>=15.0", "PyYAML>=6.0", "cryptography>=42.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "I"]
